name: Verify and publish

on:
  push:
    branches: [complex]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configure and compile
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run native tests
        run: ctest --test-dir build --output-on-failure
      - name: Check the browser against the C++ executable
        run: |
          ./build/argand_cli --fixtures build/reference.json
          node tests/check_browser.mjs build/reference.json
      - name: Package the verified demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/complex'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/complex'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the demo
        id: deployment
        uses: actions/deploy-pages@v5.0.1
